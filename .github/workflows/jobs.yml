name: jobs test
on: workflow_dispatch
jobs: 
  validate-html:
    runs-on: ubuntu-latest
    steps:
      - name: get-repo-code
        uses: actions/checkout@v4

      - name: validate html files
        run: test -f index.html

      
  validate-js:
    runs-on: ubuntu-latest
    steps:
      - name: get-repo-code
        uses: actions/checkout@v4      

      - name: validate js files
        run: test -f script.js

      - name: validate js code
        run: node --check script.js

    validate-code:
    # needs: [validate-html, validate-js]
    runs-on: ubuntu-latest
    steps:
      - name: get-repo-code
        uses: actions/checkout@v4   

      - name: validate JS code
        run: node --check script.js
      - name: validate html code
        run: npx htmlhint index.html