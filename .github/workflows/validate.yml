name: Validate files
on: workflow_dispatch
jobs:
  validate-file:
    runs-on: ubuntu-latest
    steps: 
      - name: get-repo-code
        uses: actions/checkout@v4
      - name: validate html files
        run: test -f home.html
      - name: validate js files
        run: test -f script.js
      - name: validate js code
        run: node --check script.js